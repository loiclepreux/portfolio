<main
    class="min-h-screen bg-[#090b10] px-8 py-16 pr-32 text-white md:px-16 md:pr-40"
>
    <section class="mb-10">
        <p class="mb-3 text-sm uppercase tracking-[0.35em] text-cyan-400">
            Créations
        </p>

        <h1 class="mb-6 text-4xl font-bold text-white md:text-5xl">
            Ce que je fais, ce que je prépare
        </h1>

        <p class="max-w-3xl text-base leading-8 text-gray-400">
            Du code, un roman, un jeu, des parties en ligne : tout ce que je
            crée et construis, qu'il s'agisse de projets terminés, en cours ou
            encore à l'état d'envie.
        </p>
    </section>

    <section class="mb-20">
        <h2 class="mb-8 text-2xl font-semibold text-cyan-300">Réalisations</h2>
        <div
            id="doneCreationsContainer"
            class="grid gap-8 md:grid-cols-2 xl:grid-cols-3"
        ></div>
    </section>

    <section class="mb-20">
        <h2 class="mb-2 text-2xl font-semibold text-cyan-300">
            En cours & à venir
        </h2>
        <p class="mb-8 text-sm text-gray-500">
            Ce sur quoi je travaille, et ce que j'ai envie de faire.
        </p>
        <div
            id="nextCreationsContainer"
            class="grid gap-8 md:grid-cols-2 xl:grid-cols-3"
        ></div>
    </section>
</main>
