<main class="min-h-screen bg-[#090b10] px-8 py-16 pr-32 text-white md:px-16 md:pr-40">
    <section class="mb-10">
        <div class="mb-4 flex items-center gap-3">
            <div>
                <h1>
                    <span class="text-3xl font-extrabold uppercase tracking-[0.4em] text-cyan-400 md:text-8x">📁 Projets </span>
                </h1>

                <p class="mt-4 text-2xl font-semibold text-white md:text-3xl">
                    Mes réalisations
                </p>
            </div>
        </div>

        <p class="max-w-3xl text-base leading-8 text-gray-400">
            Une sélection de projets réalisés dans le cadre de ma formation, de
            mes travaux personnels et de futures expériences professionnelles.
        </p>
    </section>

    <section class="mb-20">
        <div class="mb-8 flex items-center gap-3">
            <div
                class="flex h-10 w-10 items-center justify-center rounded-xl border border-cyan-500/20 bg-cyan-500/10 text-cyan-300"
            >
                <span class="text-lg">🧪</span>
            </div>

            <h2 class="text-2xl font-semibold text-cyan-300">
                Projets personnels
            </h2>
        </div>

        <div
            id="personalProjectsContainer"
            class="grid gap-8 md:grid-cols-2 xl:grid-cols-3"
        ></div>
    </section>

    <section class="mb-20">
        <div class="mb-8 flex items-center gap-3">
            <div
                class="flex h-10 w-10 items-center justify-center rounded-xl border border-cyan-500/20 bg-cyan-500/10 text-cyan-300"
            >
                <span class="text-lg">💼</span>
            </div>

            <h2 class="text-2xl font-semibold text-cyan-300">
                Projets professionnels
            </h2>
        </div>

        <div
            id="professionalProjectsContainer"
            class="grid gap-8 md:grid-cols-2 xl:grid-cols-3"
        ></div>
    </section>
</main>
